# Activate with: --spring.profiles.active=mysql
# Set credentials using environment variables; never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_order_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
